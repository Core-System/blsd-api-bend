spring.application.name=blsd-api-bend

# Configurações de Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/blessed7?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

cors.allowed-origins=http://localhost:5173

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tamanho de arquivo permitido
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Segurança e JWT
jwt.validity=3600000
spring.security.user.password.strength=strong
jwt.secret=${JWT_SECRET}

# ==========================================
# CONFIGURAÇÕES DE INTEGRAÇÃO (CAL.COM)
# ==========================================
calcom.api.key=${CALCOM_API_KEY}
calcom.api.version=2026-02-25

# Serviço de Notificações
notificacao.api.url=http://localhost:8082