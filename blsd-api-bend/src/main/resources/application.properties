spring.application.name=blsd-api-bend

# Configurações de Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/blessed7?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

cors.allowed-origins=http://localhost:5173

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#Tamanho de arquivo permitido
spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=5MB

# Segurança e JWT
# tempo de expiração do token em milissegundos (esse valor indica que ele vai expirar em 1 hora)
jwt.validity=3600000

# palavra passe do token (segredo) necessita de no minimo 32 caracteres e serve para assinar e verificar os tokens, sendo recomendável usar uma chave complexa e difícil de advinhar para aumentar a segurança da aplicação
# limitar tentativas de login
spring.security.user.password.strength=strong

# palavra passe do token (segredo)
jwt.secret=${JWT_SECRET}

# ==========================================
# CONFIGURAÇÕES DA POC (AGENDAMENTO CAL.COM)
# ==========================================

# server.port=8081

# Serviço de Notificações
notificacao.api.url=http://localhost:8082

# Chave de API da Cal.com (Configurada via variável de ambiente por segurança)
calcom.api.key=${CALCOM_API_KEY}